[package]
name = "x-spider"
version = "0.0.0"
description = "A spider for X (Twitter)"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-all", "fs-all", "path-all", "os-all", "clipboard-all", "app-all", "dialog-all", "window-all", "notification-all", "protocol-asset", "devtools" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

reqwest = { version = "0.11", default-features = false, features = ["json", "gzip", "rustls-tls", "cookies"] }

time = "=0.3.36"

[features]
custom-protocol = ["tauri/custom-protocol"]